<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pocket Legion" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- favicon 未整備だと未指定時にブラウザが /favicon.ico を取りに行って 404 になる
         (コンソールエラーとして残ってしまう)。PWA アイコンをそのまま favicon にも使う -->
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="icon" href="./icon-192.png" />
    <title>Pocket Legion</title>
  </head>
  <body>
    <main id="app">
      <div id="stage">
        <canvas id="corridor"></canvas>
        <div id="portrait"></div>
        <div id="stage-body"></div>
        <div id="icons-enemy" class="icons"></div>
        <div id="icons-ally" class="icons"></div>
      </div>
      <div id="log"></div>
      <div id="status"></div>
      <div id="cluster">
        <div id="slots"></div>
        <div id="controls"></div>
      </div>
      <div id="picker" hidden></div>
      <div id="detail-modal" hidden></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
